name: Share a crosshair
description: Add your crosshair to the community library
title: "Crosshair: "
labels: ["crosshair submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! The easiest way: in OpenCrosshair open **Customize** and click **Share yours in the library…**, which fills in this form for you.
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: My crosshair
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Share code
      description: "In the customize window press **Copy mine** and paste it here. It starts with OC2:"
      render: text
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags (optional)
      placeholder: dot, small, cs2
  - type: checkboxes
    id: rules
    attributes:
      label: Sharing
      options:
        - label: I made this crosshair myself (or it's a simple, common design) and I'm fine with it being shared under the MIT license.
          required: true
